<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Weister 启动中</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .wrap { width: 380px; text-align: center; }
      .logo {
        width: 68px; height: 68px; margin: 0 auto 22px;
        border-radius: 16px;
        background: linear-gradient(135deg, #2f81f7, #a371f7);
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 700; letter-spacing: -1px;
      }
      h1 { font-size: 19px; font-weight: 600; margin-bottom: 6px; }
      .sub { font-size: 13px; color: #7d8590; margin-bottom: 26px; }
      .bar {
        height: 4px; background: #21262d; border-radius: 2px;
        overflow: hidden; margin-bottom: 14px;
      }
      .fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #2f81f7, #a371f7);
        border-radius: 2px;
        transition: width 0.4s ease;
      }
      .step { font-size: 12px; color: #8b949e; height: 16px; }
      .err { color: #f85149; font-size: 13px; margin-top: 12px; display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">W</div>
      <h1>Weister</h1>
      <div class="sub">金融投研智能体</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="step" id="step">正在启动…</div>
      <div class="err" id="err"></div>
    </div>

    <script>
      const STEPS = [
        { at: 5, text: "分配端口…" },
        { at: 20, text: "启动后端服务…" },
        { at: 55, text: "等待后端就绪…" },
        { at: 75, text: "启动界面服务…" },
        { at: 92, text: "加载应用…" },
      ];
      let reached = 0;

      // 无 IPC 时（浏览器直接打开）用定时器模拟推进，仅用于视觉预览
      const hasIPC = typeof window.__weisterOnProgress === "function";

      function setProgress(pct, text) {
        reached = Math.max(reached, pct);
        document.getElementById("fill").style.width = reached + "%";
        if (text) document.getElementById("step").textContent = text;
      }

      function showError(msg) {
        const el = document.getElementById("err");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("step").textContent = "启动失败";
      }

      if (hasIPC) {
        window.__weisterOnProgress = setProgress;
        window.__weisterOnError = showError;
      } else {
        let p = 5;
        const timer = setInterval(() => {
          p += 3;
          if (p > 88) { clearInterval(timer); return; }
          const s = STEPS.find((x) => x.at > p - 3) || STEPS[STEPS.length - 1];
          setProgress(p, s.text);
        }, 300);
      }
    </script>
  </body>
</html>
